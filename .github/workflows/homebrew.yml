name: Update Homebrew package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'murlexander/louppe-media-culler'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the distribution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # Verifies the ZIP and renders the cask on the newest main, then pushes.
      # Retries when the feed commit (appcast.xml) moves main first.
      - name: Verify the latest stable ZIP and publish the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/publish_cask.sh
