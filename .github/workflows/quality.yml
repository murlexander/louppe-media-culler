name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Swift, filesystem, UI logic, and release package
    # RAW 9 resource APIs require the macOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Redacted credential scan
        run: ./Scripts/check_credentials.sh --all-refs

      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Strict Swift 6 build
        run: |
          swift build --disable-keychain \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors

      - name: XCTest
        env:
          LOUPPE_FOREGROUND_UI: "1"
        run: swift test --disable-keychain

      - name: Deterministic logic and recovery checks
        env:
          LOUPPE_SKIP_REAL_TRASH: "1"
        run: ./Tests/run_performance_checks.sh

      - name: Scrollbar checks
        run: ./Tests/run_scrollbar_checks.sh

      - name: Native video checks
        run: ./Tests/run_video_checks.sh

      - name: Release build and local preflight
        run: ./build_app.sh
